<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 1 - Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    .error { color: red; font-size: 0.85em; display: block; margin-top: 4px; min-height: 18px; }
    button { padding: 10px 15px; cursor: pointer; width: 100%; background-color: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background-color: #0056b3; }
    .nav-link { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #007bff; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Registration Form</h2>
  <form id="regForm" novalidate>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name">
      <span class="error" id="nameError"></span>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email">
      <span class="error" id="emailError"></span>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password">
      <span class="error" id="passwordError"></span>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword">
      <span class="error" id="confirmPasswordError"></span>
    </div>

    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age">
      <span class="error" id="ageError"></span>
    </div>

    <button type="submit">Register</button>
  </form>

  <!-- رابط يتنقل لصفحة الجدول -->
  <a href="data.html" class="nav-link">Go to Part 2: Data Table &rarr;</a>

  <script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      let isValid = true;

      document.querySelectorAll('.error').forEach(el => el.textContent = '');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const age = document.getElementById('age').value.trim();

      if (!name) {
        document.getElementById('nameError').textContent = 'Name is required.';
        isValid = false;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email) {
        document.getElementById('emailError').textContent = 'Email is required.';
        isValid = false;
      } else if (!emailRegex.test(email)) {
        document.getElementById('emailError').textContent = 'Please enter a valid email address.';
        isValid = false;
      }

      if (!password) {
        document.getElementById('passwordError').textContent = 'Password is required.';
        isValid = false;
      } else if (password.length < 8) {
        document.getElementById('passwordError').textContent = 'Password must be at least 8 characters.';
        isValid = false;
      }

      if (!confirmPassword) {
        document.getElementById('confirmPasswordError').textContent = 'Please confirm your password.';
        isValid = false;
      } else if (password !== confirmPassword) {
        document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
        isValid = false;
      }

      if (!age) {
        document.getElementById('ageError').textContent = 'Age is required.';
        isValid = false;
      } else if (isNaN(age) || Number(age) <= 0) {
        document.getElementById('ageError').textContent = 'Please enter a valid age.';
        isValid = false;
      }

      if (isValid) {
        alert('Form submitted successfully!');
      }
    });
  </script>
</body>
</html>
