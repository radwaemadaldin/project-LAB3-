<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 3 - Web Development</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 1.8rem;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background-color: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      text-decoration: none;
      color: #007bff;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.2s ease-in-out;
    }
    .card:hover {
      background-color: #007bff;
      color: #ffffff;
      border-color: #007bff;
      transform: translateY(-2px);
    }
    .arrow {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Web Development - Lab 3</h1>
    <p>Select a task below to view the implementation:</p>

    <div class="links-grid">
      <a href="validation.html" class="card">
        <span>Part 1: Registration Form</span>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="data.html" class="card">
        <span>Part 2: Data Table</span>
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </div>

</body>
</html>
